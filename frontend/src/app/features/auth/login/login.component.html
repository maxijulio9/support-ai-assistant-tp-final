<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Soporte N1</mat-card-title>
      <mat-card-subtitle>Iniciá sesión</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <mat-form-field appearance="outline" class="login-field">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="username"
            maxlength="254"
          />
          <mat-error>
            @if (form.controls.email.hasError('required')) {
              Ingresá tu email.
            } @else if (form.controls.email.hasError('email')) {
              Ingresá un email válido.
            }
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="login-field">
          <mat-label>Contraseña</mat-label>
          <input
            #passwordInput
            matInput
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            maxlength="72"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="togglePasswordVisibility()"
          >
            <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>Ingresá tu contraseña.</mat-error>
        </mat-form-field>

        @if (errorMessage()) {
          <p class="login-error" role="alert">{{ errorMessage() }}</p>
        }

        <button mat-flat-button type="submit" class="login-submit" [disabled]="submitting()">
          {{ submitting() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <a routerLink="/forgot-password" class="login-forgot-link">¿Olvidaste tu contraseña?</a>
    </mat-card-content>
  </mat-card>
</div>
