<div class="kpi-card" [class.kpi-card--highlight]="highlight()">
  <p class="kpi-card-label">{{ label() }}</p>
  <p class="kpi-card-value">{{ value() }}</p>
  @if (delta(); as delta) {
    <p class="kpi-card-delta kpi-card-delta--{{ delta.tone }}">
      <span aria-hidden="true">{{ delta.arrow }} {{ delta.text }}</span>
      <span class="visually-hidden">{{ delta.spoken }}</span>
      <span class="kpi-card-delta-label" aria-hidden="true">vs. anterior</span>
    </p>
  }
  @if (sparklineValues().length > 0) {
    <div
      echarts
      [options]="sparklineOptions()"
      class="kpi-card-sparkline"
      role="img"
      [attr.aria-label]="'Serie diaria del período, ' + trendLabel()"
    ></div>
  }
</div>
