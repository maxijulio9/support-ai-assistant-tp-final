<h2 mat-dialog-title>Descartar respuesta</h2>

<mat-dialog-content>
  <p class="discard-dialog-warning">
    No se publica nada en el ticket y no se genera otra respuesta. El ticket queda abierto en JSM para atenderlo
    a mano.
  </p>

  <mat-form-field appearance="outline" class="discard-dialog-field">
    <mat-label>Motivo (opcional)</mat-label>
    <textarea matInput [formControl]="reasonControl" [maxlength]="reasonMaxLength" rows="3"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button type="button" (click)="confirm()">Descartar</button>
</mat-dialog-actions>
