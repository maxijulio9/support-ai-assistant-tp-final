<div class="app-page">
  <header class="app-page-header">
    <div>
      <h1 class="app-page-title">Revisión de respuestas</h1>
      <p class="app-page-subtitle">Aprobá o regenerá las respuestas sugeridas por el sistema antes de enviarlas</p>
    </div>
    @if (queueState() !== 'loading' && queueState() !== 'error') {
      <span class="app-page-chip">{{ totalFiltered() }} pendientes</span>
    }
  </header>

  <div class="app-page-panel review-page-body">
    <app-review-queue
      class="review-page-queue"
      [items]="pageItems()"
      [selectedId]="selectedId()"
      [state]="queueState()"
      [totalPending]="totalPending()"
      [totalFiltered]="totalFiltered()"
      [page]="page()"
      [totalPages]="totalPages()"
      [searchTerm]="searchTerm()"
      [priorityFilter]="priorityFilter()"
      [priorityOptions]="priorityOptions()"
      [projectFilter]="projectFilter()"
      [projectOptions]="projectOptions()"
      [sort]="sort()"
      [truncated]="queueTruncated()"
      (searchTermChange)="onSearchTermChange($event)"
      (priorityFilterChange)="onPriorityFilterChange($event)"
      (projectFilterChange)="onProjectFilterChange($event)"
      (sortChange)="onSortChange($event)"
      (clearFilters)="clearFilters()"
      (selectItem)="selectItem($event)"
      (pageChange)="onPageChange($event)"
      (retry)="loadQueue()"
    />

    <app-review-detail
      class="review-page-detail"
      [detail]="detail()"
      [state]="detailState()"
      [submitting]="submittingAction()"
      (approve)="approve()"
      (regenerate)="openRegenerateDialog()"
      (discard)="openDiscardDialog()"
      (editApprove)="openEditApproveDialog()"
      (retry)="retryDetail()"
    />
  </div>
</div>
