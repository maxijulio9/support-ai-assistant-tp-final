<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <p class="attachment-analysis-dialog-project">{{ projectLine }}</p>
  <p class="attachment-analysis-dialog-text">{{ intro }}</p>

  @for (section of sections; track section.title) {
    <section class="attachment-analysis-dialog-section">
      <h3 class="attachment-analysis-dialog-heading">{{ section.title }}</h3>
      <ul class="attachment-analysis-dialog-list">
        @for (item of section.items; track item) {
          <li>{{ item }}</li>
        }
      </ul>
    </section>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" cdkFocusInitial (click)="cancel()">{{ texts.cancel }}</button>
  <button mat-flat-button type="button" (click)="confirm()">{{ texts.confirm }}</button>
</mat-dialog-actions>
