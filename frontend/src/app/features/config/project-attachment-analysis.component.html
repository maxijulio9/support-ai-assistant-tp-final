<section class="attachment-analysis" aria-labelledby="attachment-analysis-title">
  <mat-slide-toggle
    class="attachment-analysis-toggle"
    [checked]="toggle().checked"
    [disabled]="toggle().disabled"
    aria-describedby="attachment-analysis-help"
    (change)="onToggle($event)"
  >
    <span id="attachment-analysis-title" class="attachment-analysis-title">{{ title }}</span>
  </mat-slide-toggle>

  <div id="attachment-analysis-help" class="attachment-analysis-help">
    @for (paragraph of paragraphs; track paragraph) {
      <p>{{ paragraph }}</p>
    }
  </div>

  @if (current().error; as message) {
    <p class="attachment-analysis-error" role="alert">{{ message }}</p>
  }
</section>
