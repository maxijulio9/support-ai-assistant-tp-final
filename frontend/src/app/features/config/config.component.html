<div class="config-page">
  <h1 class="config-title">Configuración</h1>

  <mat-tab-group
    class="config-tabs"
    animationDuration="0ms"
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="onTabChange($event)"
  >
    <mat-tab label="JSM">
      <div class="config-tab-content">
        <app-jsm-connection />
      </div>
    </mat-tab>
    <mat-tab label="Proyectos">
      <div class="config-tab-content">
        <app-projects-tab />
      </div>
    </mat-tab>
    <mat-tab label="Campos y categorías">
      <div class="config-tab-content">
        <app-fields-categories-tab />
      </div>
    </mat-tab>
    <mat-tab label="Confluence">
      <div class="config-tab-content">
        <app-confluence-tab />
      </div>
    </mat-tab>
    <mat-tab label="Indexación">
      <div class="config-tab-content">
        <!-- Se renderiza solo con la pestaña activa (no con @if (true)) para
             que el polling se corte al salir: mat-tab-group no destruye el
             contenido de las pestañas al cambiar, solo lo oculta. -->
        @if (selectedTabIndex() === 4) {
          <app-indexing-tab />
        }
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
