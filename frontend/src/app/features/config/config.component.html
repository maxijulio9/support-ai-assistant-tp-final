<div class="config-page">
  <h1 class="config-title">Configuración</h1>

  <mat-tab-group
    class="config-tabs"
    animationDuration="0ms"
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="onTabChange($event)"
  >
    <mat-tab label="JSM">
      <div class="config-tab-content">
        <app-jsm-connection />
      </div>
    </mat-tab>
    <mat-tab label="Proyectos">
      <div class="config-tab-content">
        <app-projects-tab />
      </div>
    </mat-tab>
    <mat-tab label="Campos y categorías">
      <div class="config-tab-content">
        <app-fields-categories-tab />
      </div>
    </mat-tab>
    <mat-tab label="Confluence">
      <div class="config-tab-content">
        <app-confluence-tab />
      </div>
    </mat-tab>
    <mat-tab label="Indexación">
      <div class="config-tab-content">
        <p class="config-placeholder">Esta sección se habilita en un próximo paso.</p>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
