<h2 mat-dialog-title>{{ texts.title }}</h2>

<mat-dialog-content>
  <p class="regenerate-secret-text">{{ texts.body }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" cdkFocusInitial (click)="cancel()">{{ texts.cancel }}</button>
  <button mat-flat-button type="button" class="regenerate-secret-confirm-button" (click)="confirm()">
    {{ texts.confirm }}
  </button>
</mat-dialog-actions>
