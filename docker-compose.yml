services:

  backend:
    build:
      context: ./backend
    container_name: support-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: arq app.modules.event_pipeline.settings.WorkerSettings
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
    restart: unless-stopped
  kb_worker:
    build:
      context: ./backend
    container_name: support-ai-kb-worker
    command: arq app.modules.event_pipeline.settings.KbWorkerSettings
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: support-ai-frontend
    ports:
      - "4200:80"
    environment:
      # URL base del backend: Caddy reenvia /auth y /api a este destino
      API_UPSTREAM: http://backend:8000
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: support-ai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
